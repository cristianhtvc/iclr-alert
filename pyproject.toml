[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iclr-alert"
version = "0.3.0"
description = "Personal OpenReview score monitoring with authenticated API access and Bark notifications."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/cristianhtvc/iclr-alert"
Issues = "https://github.com/cristianhtvc/iclr-alert/issues"

[project.scripts]
iclr-alert = "iclr_alert.__main__:main"

[tool.setuptools]
packages = ["iclr_alert"]

[tool.setuptools.package-data]
iclr_alert = ["setup.html"]
